name: Build Job Log

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and bundle web app
        run: |
          npm ci
          npm run build
      - name: Create Android project
        run: |
          npx cap add android
          npx --yes @capacitor/assets@3.0.5 generate --android \
            --iconBackgroundColor '#0E3B2C' --iconBackgroundColorDark '#0E3B2C' \
            --splashBackgroundColor '#F3F5F1' --splashBackgroundColorDark '#F3F5F1'
          MAN=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS USE_BIOMETRIC SCHEDULE_EXACT_ALARM; do
            grep -q "permission.$P\"" "$MAN" || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$MAN"
          done
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"2.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
      - name: Use the permanent signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../JobLog.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JobLog-apk
          path: JobLog.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Job Log build ${{ github.run_number }}
          make_latest: true
          files: JobLog.apk
          body: Download JobLog.apk on your Android phone and open it to install.

  desktop:
    name: Desktop web app (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
